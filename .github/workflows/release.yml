name: Release

# 发布流程：推 vX.Y.Z tag 触发（由 scripts/release.sh 创建）。
on:
  push:
    tags:
      - 'v*'

permissions:
  # npm trusted publishing (OIDC)：npm 用 workflow 的 OIDC token 换短时凭证，
  # 不再需要 NPM_TOKEN secret，并自动生成 provenance 证明。
  id-token: write
  # changelogithub 创建 GitHub Release
  contents: write

jobs:
  release:
    name: Verify & Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # changelogithub 需要完整历史收集自上次 release 以来的提交
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          # npm OIDC 信任发布要求 Node >= 22.14 / npm >= 11.5.1。
          # 注意：不要设置 registry-url —— setup-node 会因此写入
          # _authToken=${NODE_AUTH_TOKEN} 到 .npmrc（actions/setup-node #1551），
          # 让 npm 优先走 token 认证而非 OIDC，导致 provenance 缺失。
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tag push 不会触发 test.yml（仅 main push / PR），发布前必须自带验证
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # 防止 tag 与版本号漂移导致发布错版
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag '${TAG}' does not match package.json version 'v${VERSION}'"
            exit 1
          fi
          echo "Publishing version ${VERSION}"

      # 以下 4 个包由 release.sh 按同一 bump 类型各自升级版本；发布走 OIDC 自动认证。
      # unset NODE_AUTH_TOKEN：杜绝任何 token 认证路径（如 NPM_TOKEN secret 自动注入），
      # 强制 npm 使用 OIDC，从而自动生成 provenance。
      - name: Publish @hacxy/tsconfig
        working-directory: shared/tsconfig
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public

      - name: Publish @hacxy/prettier-config
        working-directory: shared/prettier-config
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public

      - name: Publish @hacxy/eslint-config
        working-directory: shared/eslint-config
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public

      - name: Publish @hacxy/kick
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public

      - name: Create GitHub Release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
